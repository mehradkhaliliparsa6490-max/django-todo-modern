{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ویرایش تسک | تسک‌منیجر</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Vazirmatn', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .gradient-bg { background: linear-gradient(-45deg, #0f172a, #1e1b4b, #1e293b, #0f172a); background-size: 400% 400%; animation: gradient 15s ease infinite; }
        @keyframes gradient { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in-up { animation: fadeInUp 0.6s ease-out; }
        input, select, textarea { color-scheme: dark; }
    </style>
</head>
<body class="min-h-screen gradient-bg text-white p-4">

<div class="max-w-2xl mx-auto fade-in-up">
    <a href="{% url 'todos' %}" class="inline-flex items-center gap-2 text-gray-400 hover:text-white transition mb-6 mt-4">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
        بازگشت به داشبورد
    </a>

    <div class="glass rounded-3xl p-8">
        <div class="flex items-center gap-4 mb-8">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-blue-500 to-indigo-500 flex items-center justify-center shadow-lg">
                <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
            </div>
            <div>
                <h1 class="text-2xl font-bold">ویرایش تسک</h1>
                <p class="text-gray-400 text-sm">اطلاعات تسک را به‌روز کنید</p>
            </div>
        </div>

        <form method="post" class="space-y-5">
            {% csrf_token %}

            <div>
                <label class="block text-gray-300 text-sm font-medium mb-2">عنوان تسک</label>
                <input type="text" name="title" required value="{{ form.title.value|default:'' }}"
                    class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/30 transition-all">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-gray-300 text-sm font-medium mb-2">اولویت</label>
                    <select name="priority" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/30 transition-all">
                        {% for val, label in form.fields.priority.choices %}
                        <option value="{{ val }}" {% if form.priority.value|stringformat:"s" == val|stringformat:"s" %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-gray-300 text-sm font-medium mb-2">وضعیت</label>
                    <select name="status" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/30 transition-all">
                        {% for val, label in form.fields.status.choices %}
                        <option value="{{ val }}" {% if form.status.value == val %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-gray-300 text-sm font-medium mb-2">تاریخ سررسید <span class="text-gray-500">(اختیاری)</span></label>
                <input type="datetime-local" name="due_date" value="{{ form.due_date.value|date:'Y-m-d\TH:i' }}"
                    class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/30 transition-all">
            </div>

            <div>
                <label class="block text-gray-300 text-sm font-medium mb-2">توضیحات <span class="text-gray-500">(اختیاری)</span></label>
                <textarea name="description" rows="4"
                    class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/30 transition-all resize-none">{{ form.description.value|default:'' }}</textarea>
            </div>

            <div class="flex gap-3 pt-2">
                <a href="{% url 'todos' %}" class="flex-1 text-center py-3 bg-white/5 hover:bg-white/10 border border-white/10 rounded-xl font-semibold transition">انصراف</a>
                <button type="submit" class="flex-1 py-3 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 rounded-xl font-semibold shadow-lg transform hover:-translate-y-0.5 transition-all">ذخیره تغییرات</button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
