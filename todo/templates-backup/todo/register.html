{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت‌نام | تسک‌منیجر</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Vazirmatn', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .gradient-bg { background: linear-gradient(-45deg, #1e1b4b, #4c1d95, #831843, #1e1b4b); background-size: 400% 400%; animation: gradient 8s ease infinite; }
        @keyframes gradient { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in-up { animation: fadeInUp 0.6s ease-out; }
    </style>
</head>
<body class="min-h-screen gradient-bg flex items-center justify-center p-4 relative overflow-hidden">
    <div class="absolute top-20 right-20 w-72 h-72 bg-purple-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20"></div>
    <div class="absolute bottom-20 left-20 w-72 h-72 bg-pink-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20"></div>

    <div class="glass rounded-3xl shadow-2xl p-8 w-full max-w-md fade-in-up relative z-10">
        <div class="flex justify-center mb-6">
            <div class="w-20 h-20 rounded-2xl bg-gradient-to-br from-pink-500 to-purple-500 flex items-center justify-center shadow-lg">
                <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path>
                </svg>
            </div>
        </div>
        <h1 class="text-3xl font-bold text-white text-center mb-2">ایجاد حساب</h1>
        <p class="text-gray-300 text-center mb-8 text-sm">به تسک‌منیجر خوش آمدید</p>

        {% if error %}
        <div class="mb-6 p-4 rounded-xl bg-red-500/20 border border-red-500/50 text-red-200 text-sm">
            {{ error }}
        </div>
        {% endif %}

        <form method="post" class="space-y-5">
            {% csrf_token %}
            <div>
                <label class="block text-gray-300 text-sm font-medium mb-2">نام کاربری</label>
                <input type="text" name="username" required placeholder="نام کاربری خود را انتخاب کنید"
                    class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-500/30 transition-all">
            </div>
            <div>
                <label class="block text-gray-300 text-sm font-medium mb-2">رمز عبور</label>
                <input type="password" name="password" required placeholder="حداقل ۸ کاراکتر"
                    class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-500/30 transition-all">
            </div>
            <div>
                <label class="block text-gray-300 text-sm font-medium mb-2">تکرار رمز عبور</label>
                <input type="password" name="confirm_password" required placeholder="رمز را دوباره وارد کنید"
                    class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-500/30 transition-all">
            </div>
            <button type="submit"
                class="w-full py-3 bg-gradient-to-r from-pink-600 to-purple-600 hover:from-pink-500 hover:to-purple-500 text-white font-semibold rounded-xl shadow-lg transform hover:-translate-y-0.5 transition-all">
                ثبت‌نام
            </button>
        </form>

        <p class="text-center text-gray-400 text-sm mt-6">
            قبلاً ثبت‌نام کرده‌اید؟
            <a href="{% url 'login' %}" class="text-pink-400 hover:text-purple-400 font-semibold transition">وارد شوید</a>
        </p>
    </div>
</body>
</html>
