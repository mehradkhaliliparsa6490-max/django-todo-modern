{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <link rel="icon" type="image/svg+xml" href="{% static 'todo/favicon.svg' %}">
    <link rel="stylesheet" href="{% static 'todo/theme.css' %}">
    <script src="{% static 'todo/theme.js' %}"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود | تسک‌منیجر</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { vazir: ['Vazirmatn', 'sans-serif'] } } }
        }
    </script>
    <style>
        body { font-family: 'Vazirmatn', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .gradient-bg { background: linear-gradient(-45deg, #1e1b4b, #4c1d95, #831843, #1e1b4b); background-size: 400% 400%; animation: gradient 8s ease infinite; }
        @keyframes gradient { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in-up { animation: fadeInUp 0.6s ease-out; }
    </style>
</head>
<body class="min-h-screen gradient-bg flex items-center justify-center p-4 relative overflow-hidden">
    <div class="absolute top-20 right-20 w-72 h-72 bg-purple-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20"></div>
    <div class="absolute bottom-20 left-20 w-72 h-72 bg-pink-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20"></div>

    <div class="glass rounded-3xl shadow-2xl p-8 w-full max-w-md fade-in-up relative z-10">
        <div class="flex justify-center mb-6">
            <div class="w-20 h-20 rounded-2xl bg-gradient-to-br from-purple-500 to-pink-500 flex items-center justify-center shadow-lg">
                <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path>
                </svg>
            </div>
        </div>
        <h1 class="text-3xl font-bold text-white text-center mb-2">خوش آمدید</h1>
        <p class="text-gray-300 text-center mb-8 text-sm">برای ادامه وارد حساب کاربری خود شوید</p>

        {% if error %}
        <div class="mb-6 p-4 rounded-xl bg-red-500/20 border border-red-500/50 text-red-200 text-sm">
            {{ error }}
        </div>
        {% endif %}

        <form method="post" class="space-y-5">
            {% csrf_token %}
            <div>
                <label class="block text-gray-300 text-sm font-medium mb-2">نام کاربری</label>
                <input type="text" name="username" required placeholder="نام کاربری خود را وارد کنید"
                    class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-500/30 transition-all">
            </div>
            <div>
                <label class="block text-gray-300 text-sm font-medium mb-2">رمز عبور</label>
                <input type="password" name="password" required placeholder="رمز عبور خود را وارد کنید"
                    class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-500/30 transition-all">
            </div>
            <button type="submit"
                class="w-full py-3 bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white font-semibold rounded-xl shadow-lg transform hover:-translate-y-0.5 transition-all">
                ورود به حساب
            </button>
        </form>

        <p class="text-center text-gray-400 text-sm mt-6">
            حساب کاربری ندارید؟
            <a href="{% url 'register' %}" class="text-purple-400 hover:text-pink-400 font-semibold transition">ثبت‌نام کنید</a>
        </p>
    </div>
<button id="theme-toggle" onclick="toggleTheme()" aria-label="تغییر تم" class="fixed bottom-6 right-6 w-14 h-14 rounded-full bg-gradient-to-br from-purple-600 to-pink-600 shadow-lg shadow-purple-500/50 flex items-center justify-center hover:scale-110 transition-all z-50">
    <svg id="theme-icon" class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
    </svg>
</button>

</body>
</html>
