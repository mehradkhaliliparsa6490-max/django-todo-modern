{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <link rel="icon" type="image/svg+xml" href="{% static 'todo/favicon.svg' %}">
    <link rel="stylesheet" href="{% static 'todo/theme.css' %}">
    <script src="{% static 'todo/theme.js' %}"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ویرایش پروفایل | تسک‌منیجر</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Vazirmatn', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .gradient-bg { background: linear-gradient(-45deg, #0f172a, #1e1b4b, #1e293b, #0f172a); background-size: 400% 400%; animation: gradient 15s ease infinite; }
        @keyframes gradient { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in-up { animation: fadeInUp 0.6s ease-out; }
        input, textarea { color-scheme: dark; }
    </style>
</head>
<body class="min-h-screen gradient-bg text-white p-4">

<div class="max-w-3xl mx-auto fade-in-up">
    <a href="{% url 'profile' %}" class="inline-flex items-center gap-2 text-gray-400 hover:text-white transition mb-6 mt-4">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
        بازگشت به پروفایل
    </a>

    <div class="glass rounded-3xl p-8">
        <div class="flex items-center gap-4 mb-8">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-purple-500 to-pink-500 flex items-center justify-center shadow-lg">
                <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
            </div>
            <div>
                <h1 class="text-2xl font-bold">ویرایش پروفایل</h1>
                <p class="text-gray-400 text-sm">اطلاعات حساب خود را به‌روز کنید</p>
            </div>
        </div>

        <form method="post" enctype="multipart/form-data" class="space-y-6">
            {% csrf_token %}

            <div class="space-y-4">
                <h3 class="text-sm font-semibold text-purple-400 border-b border-white/10 pb-2">اطلاعات حساب</h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-gray-300 text-sm font-medium mb-2">نام</label>
                        <input type="text" name="first_name" value="{{ form.first_name.value|default:'' }}"
                            class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-500/30 transition-all">
                    </div>
                    <div>
                        <label class="block text-gray-300 text-sm font-medium mb-2">نام خانوادگی</label>
                        <input type="text" name="last_name" value="{{ form.last_name.value|default:'' }}"
                            class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-500/30 transition-all">
                    </div>
                </div>
                <div>
                    <label class="block text-gray-300 text-sm font-medium mb-2">ایمیل</label>
                    <input type="email" name="email" value="{{ form.email.value|default:'' }}"
                        class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-500/30 transition-all">
                </div>
            </div>

            <div class="space-y-4">
                <h3 class="text-sm font-semibold text-pink-400 border-b border-white/10 pb-2">اطلاعات تکمیلی</h3>

                <div>
                    <label class="block text-gray-300 text-sm font-medium mb-2">عکس پروفایل</label>
                    {% if profile_form.instance.profile_image %}
                    <div class="mb-2">
                        <img src="{{ profile_form.instance.profile_image.url }}" class="w-20 h-20 rounded-full object-cover border-2 border-purple-500" alt="current">
                    </div>
                    {% endif %}
                    <input type="file" name="profile_image" accept="image/*"
                        class="w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-purple-500/20 file:text-purple-300 hover:file:bg-purple-500/30 file:cursor-pointer cursor-pointer bg-white/5 rounded-xl border border-white/10">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-gray-300 text-sm font-medium mb-2">ایمیل سازمانی</label>
                        <input type="email" name="organizational_email" value="{{ profile_form.organizational_email.value|default:'' }}"
                            class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:outline-none focus:border-pink-500 focus:ring-2 focus:ring-pink-500/30 transition-all">
                    </div>
                    <div>
                        <label class="block text-gray-300 text-sm font-medium mb-2">موبایل</label>
                        <input type="text" name="mobile" value="{{ profile_form.mobile.value|default:'' }}" maxlength="12"
                            class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:outline-none focus:border-pink-500 focus:ring-2 focus:ring-pink-500/30 transition-all">
                    </div>
                </div>

                <div>
                    <label class="block text-gray-300 text-sm font-medium mb-2">شماره داخلی</label>
                    <input type="text" name="internal_number" value="{{ profile_form.internal_number.value|default:'' }}" maxlength="5"
                        class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:outline-none focus:border-pink-500 focus:ring-2 focus:ring-pink-500/30 transition-all">
                </div>

                <div>
                    <label class="block text-gray-300 text-sm font-medium mb-2">بیوگرافی</label>
                    <textarea name="bio" rows="3" maxlength="255" placeholder="کمی درباره خودت بنویس..."
                        class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-pink-500 focus:ring-2 focus:ring-pink-500/30 transition-all resize-none">{{ profile_form.bio.value|default:'' }}</textarea>
                </div>
            </div>

            <div class="flex gap-3 pt-2">
                <a href="{% url 'profile' %}" class="flex-1 text-center py-3 bg-white/5 hover:bg-white/10 border border-white/10 rounded-xl font-semibold transition">انصراف</a>
                <button type="submit" class="flex-1 py-3 bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 rounded-xl font-semibold shadow-lg transform hover:-translate-y-0.5 transition-all">ذخیره تغییرات</button>
            </div>
        </form>
    </div>
</div>

<button id="theme-toggle" onclick="toggleTheme()" aria-label="تغییر تم" class="fixed bottom-6 right-6 w-14 h-14 rounded-full bg-gradient-to-br from-purple-600 to-pink-600 shadow-lg shadow-purple-500/50 flex items-center justify-center hover:scale-110 transition-all z-50">
    <svg id="theme-icon" class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
    </svg>
</button>

</body>
</html>
