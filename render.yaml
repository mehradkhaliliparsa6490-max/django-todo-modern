databases:
  - name: todo-db
    databaseName: todo_db
    user: todo_user

services:
  - type: web
    name: django-todo
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: todo-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true